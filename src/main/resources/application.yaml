spring:
  application:
    name: fbrl-backend

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/fbrl_db?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: fbrl_user
    password: fbrlpassword
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

logging:
  level:
    root: WARN
    com.fbrl: INFO
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF
    org.hibernate.orm.session: ERROR
    org.springframework: WARN

outbox:
  polling:
    fixed-delay-ms: 3000
    batch-size: 100

resilience4j:
  circuitbreaker:
    instances:
      kafkaEventPublisher:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - com.fbrl.domain.exception.EventPublishException

k8s:
  leader-election:
    enabled: false
    namespace: default
    lease-name: eod-settlement-leader
    lease-duration-seconds: 15
    renew-deadline-seconds: 10
    retry-period-seconds: 2