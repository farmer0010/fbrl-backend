name: Build and Deploy to k3s

# main 브랜치에 push될 때마다 이미지를 빌드해서 ACR에 올리고,
# VM(k3s) 위의 fbrl-backend Deployment 이미지를 새 태그로 교체한다.
#
# deploy 잡은 GitHub 호스트 러너가 아니라 VM에 설치된 self-hosted runner에서
# 돈다 — VM은 GitHub 쪽으로 아웃바운드 연결만 하면 되므로, NSG에 GitHub Actions의
# (자주 바뀌는) IP 대역을 인바운드로 열어줄 필요가 없다. self-hosted runner 설치는
# 이 워크플로 도입의 사전 조건이며 별도로 진행한다.
on:
  push:
    branches:
      - main

env:
  ACR_LOGIN_SERVER: fbrlacr.azurecr.io
  IMAGE_NAME: fbrl-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image (커밋 SHA 태그 + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted # VM(fbrl-k3s-vm)에 등록된 러너 — SSH 불필요, 로컬에서 바로 kubectl 실행
    steps:
      # kubectl set image는 Deployment의 RollingUpdate 전략(기본값)을 그대로 타므로,
      # 기존 Pod를 먼저 죽이지 않고 새 이미지의 Pod를 먼저 띄운 뒤 트래픽을 넘기는
      # 방식으로 다운타임을 최소화한다.
      - name: Deploy new image to k3s
        run: |
          sudo k3s kubectl set image deployment/fbrl-backend \
            fbrl-backend=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          sudo k3s kubectl rollout status deployment/fbrl-backend --timeout=180s
